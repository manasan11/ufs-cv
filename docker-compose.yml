services:
  mysql:
    image: mysql:8.0
    container_name: cv-generator-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pw
      MYSQL_DATABASE: cv_generator
      MYSQL_USER: cvapp
      MYSQL_PASSWORD: cvapp_dev_pw
    ports:
      - '3307:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - cv-generator-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ucvapp', '-pcvapp_dev_pw']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  cv-generator-mysql:
